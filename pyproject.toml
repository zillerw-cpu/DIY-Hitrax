[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diy-hitrax"
version = "0.1.0"
description = "Garage batting tracker for a tee and net using an OAK-D S2 PoE"
requires-python = ">=3.11"
dependencies = [
    "depthai>=3.0",
    "numpy",
    "opencv-python",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["hitrax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
